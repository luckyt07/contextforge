="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface pb-safe pt-safe"><div class="flex flex-col w-full relative">
<!-- Subtle underlying scrim backdrop preview representing bottom sheet overlay in mobile viewport -->
<div class="w-full px-margin-mobile pt-space-xs pb-space-lg flex flex-col items-center">
<!-- Flutter-style Bottom Sheet Container -->
<div class="w-full max-w-[48rem] bg-surface-container-lowest rounded-t-[1.75rem] rounded-b-xl shadow-xl flex flex-col overflow-hidden">
<!-- Tactile Drag Pill Handle -->
<div class="w-full pt-3 pb-1 flex justify-center items-center cursor-grab active:cursor-grabbing">
<div class="w-10 h-1.5 rounded-full bg-outline-variant opacity-70"></div>
</div>
<!-- Sheet Header Bar -->
<div class="px-space-md py-space-sm flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Close" class="w-8 h-8 rounded-full hover:bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button><h2 class="font-headline-sm text-headline-sm text-on-surface">Create Project</h2></div></div>
<!-- Sheet Scrollable Form Content -->
<div class="px-space-md py-space-sm space-y-space-md flex flex-col overflow-y-auto max-h-[calc(100vh-14rem)]"><div class="flex flex-col gap-1"><label class="font-label-md text-label-md text-on-surface" for="projectNameInput">Project Name</label><input class="w-full bg-surface-container-low rounded-lg px-space-md py-2.5 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" id="projectNameInput" placeholder="e.g. Legal Contract Analyzer" type="text" value="Legal Contract Analyzer &amp; Risk Audit"></div><div class="flex flex-col gap-1"><label class="font-label-md text-label-md text-on-surface" for="instructionsField">Instructions for AI</label><textarea class="w-full bg-surface-container-low rounded-lg p-space-md font-body-sm text-body-sm text-on-surface placeholder:text-outline resize-none focus:outline-none focus:bg-surface-container transition-colors" id="instructionsField" placeholder="What should the AI know and how should it respond?" rows="4">You are an expert contract specialist with an analytical tone. Summarize clauses, flag indemnification risks, and cite exact page numbers from provided attachments.</textarea></div><div class="flex flex-col gap-2"><label class="font-label-md text-label-md text-on-surface">Upload Document</label><label class="relative border border-outline-variant rounded-lg p-space-md flex items-center justify-center gap-2 cursor-pointer hover:bg-surface-container-low transition-colors text-center"><input class="sr-only" type="file"><span class="material-symbols-outlined text-on-surface-variant text-[20px]">upload_file</span><span class="font-body-sm text-body-sm text-on-surface-variant">Attach a document (PDF, TXT, MD up to 25MB)</span></label><div class="bg-surface-container-low rounded-lg px-space-md py-2 flex items-center justify-between gap-space-sm" id="fileItem"><div class="flex items-center gap-2 min-w-0"><span class="material-symbols-outlined text-[18px] text-on-surface-variant flex-shrink-0">description</span><span class="font-body-sm text-body-sm text-on-surface truncate">Flutter_Clean_Architecture_Spec.pdf</span><span class="font-label-sm text-label-sm text-on-surface-variant flex-shrink-0">· 2.4 MB</span></div><button aria-label="Remove document" class="w-6 h-6 rounded flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors flex-shrink-0" onclick="this.closest('#fileItem').remove()" type="button"><span class="material-symbols-outlined text-[18px]">close</span></button></div></div></div>
<!-- Sticky Modal Action Dock -->
<div class="px-space-md py-space-md bg-surface-container-lowest flex items-center gap-space-sm mt-auto shadow-[0_-4px_16px_rgba(44,40,37,0.04)]"><button class="flex-1 py-2.5 px-space-md rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md text-label-md transition-colors text-center" type="button">Cancel</button><button class="flex-1 py-2.5 px-space-md rounded-lg bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md transition-colors text-center" id="submitWorkspaceBtn" type="button">Create Project</button></div>
</div>
</div>
</div>
<script>
  // Dynamic interaction handler for template chips
  function insertPrompt(type) {
    const textarea = document.getElementById('instructionsField');
    if (!textarea) return;

    if (type === 'Coding Assistant') {
      textarea.value = "You are a senior Flutter and Dart systems engineer. Prioritize Clean Architecture, type safety, explicit code snippets, and performance profiling hints.";
    } else if (type === 'Document Synthesizer') {
      textarea.value = "Act as an academic research curator. Extract core theses, structure key findings into bulleted summaries, and cross-reference contradictory statements.";
    } else if (type === 'Creative Writing') {
      textarea.value = "You are an imaginative literary editor. Emphasize evocative sensory prose, compelling character motivations, and thoughtful thematic pacing.";
    }
  }

  // File item removal simulation
  function removeFileCard() {
    const fileCard = document.getElementById('fileItem');
    if (fileCard) {
      fileCard.style.opacity = '0';
      fileCard.style.transform = 'scale(0.95)';
      setTimeout(() => {
        fileCard.remove();
      }, 150);
    }
  }

  // Interactive toggle behavior
  const toggleBtn = document.getElementById('strictToggle');
  const toggleKnob = document.getElementById('toggleKnob');
  if (toggleBtn && toggleKnob) {
    toggleBtn.addEventListener('click', () => {
      const isChecked = toggleBtn.getAttribute('aria-checked') === 'true';
      if (isChecked) {
        toggleBtn.setAttribute('aria-checked', 'false');
        toggleBtn.classList.remove('bg-primary');
        toggleBtn.classList.add('bg-outline-variant');
        toggleKnob.classList.remove('translate-x-5');
        toggleKnob.classList.add('translate-x-0');
      } else {
        toggleBtn.setAttribute('aria-checked', 'true');
        toggleBtn.classList.remove('bg-outline-variant');
        toggleBtn.classList.add('bg-primary');
        toggleKnob.classList.remove('translate-x-0');
        toggleKnob.classList.add('translate-x-5');
      }
    });
  }

  // Create feedback feedback
  const submitBtn = document.getElementById('submitWorkspaceBtn');
  if (submitBtn) {
    submitBtn.addEventListener('click', () => {
      submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Initializing...</span>';
      setTimeout(() => {
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span><span>Created!</span>';
      }, 700);
    });
  }
</script></main>
