<!DOCTYPE html><html class="h-full" lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "secondary-fixed-dim": "#ffb59e", "tertiary-fixed": "#ffdbca", "background": "#fff8f5", "on-tertiary-fixed-variant": "#5d4030", "inverse-on-surface": "#f8efea", "on-secondary": "#ffffff", "outline-variant": "#dcc1b8", "surface-tint": "#9c4323", "surface-container": "#f5ece7", "on-error-container": "#93000a", "on-surface-variant": "#56423c", "secondary-container": "#fe9572", "tertiary": "#755544", "primary": "#994121", "secondary-fixed": "#ffdbd0", "tertiary-container": "#8f6d5b", "surface": "#fff8f5", "secondary": "#99462a", "on-background": "#1e1b18", "on-tertiary": "#ffffff", "on-error": "#ffffff", "on-surface": "#1e1b18", "inverse-surface": "#34302c", "on-secondary-fixed": "#390b00", "surface-container-high": "#efe6e2", "surface-container-low": "#fbf2ed", "surface-container-highest": "#e9e1dc", "surface-container-lowest": "#ffffff", "surface-variant": "#e9e1dc", "on-primary-container": "#fffbff", "outline": "#89726b", "surface-bright": "#fff8f5", "primary-fixed": "#ffdbcf", "primary-container": "#b95936", "on-primary-fixed": "#390c00", "on-primary": "#ffffff", "primary-fixed-dim": "#ffb59c", "on-secondary-container": "#762c12", "on-primary-fixed-variant": "#7d2d0d", "on-tertiary-container": "#fffbff", "surface-dim": "#e1d8d4", "error-container": "#ffdad6", "error": "#ba1a1a", "on-secondary-fixed-variant": "#7a2f15", "on-tertiary-fixed": "#2c1609", "tertiary-fixed-dim": "#e7bea9", "inverse-primary": "#ffb59c" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "2rem", "space-sm": "0.5rem", "space-md": "1rem", "margin-mobile": "1rem", "space-lg": "1.5rem", "gutter": "1.5rem", "space-xs": "0.25rem", "space-xl": "2.5rem", "gutter-mobile": "1rem" }, fontFamily: { "label-lg": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Merriweather"], "label-md": ["Plus Jakarta Sans"], "headline-lg": ["Merriweather"], "body-lg": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Merriweather"], "body-md": ["Plus Jakarta Sans"], "headline-md": ["Merriweather"], "display-lg": ["Merriweather"], "headline-sm": ["Merriweather"] }, fontSize: { "label-lg": ["0.875rem", { lineHeight: "1.25rem", letterSpacing: "0.01em", fontWeight: "600" }], "headline-lg-mobile": ["1.75rem", { lineHeight: "2.25rem", letterSpacing: "-0.01em", fontWeight: "400" }], "label-md": ["0.75rem", { lineHeight: "1rem", letterSpacing: "0.02em", fontWeight: "600" }], "headline-lg": ["2.25rem", { lineHeight: "2.75rem", letterSpacing: "-0.015em", fontWeight: "400" }], "body-lg": ["1.125rem", { lineHeight: "1.75rem", fontWeight: "400" }], "label-sm": ["0.6875rem", { lineHeight: "0.875rem", letterSpacing: "0.03em", fontWeight: "500" }], "body-sm": ["0.875rem", { lineHeight: "1.375rem", fontWeight: "400" }], "display-lg-mobile": ["2.25rem", { lineHeight: "2.75rem", letterSpacing: "-0.015em", fontWeight: "400" }], "body-md": ["1rem", { lineHeight: "1.625rem", fontWeight: "400" }], "headline-md": ["1.5rem", { lineHeight: "2rem", letterSpacing: "-0.01em", fontWeight: "400" }], "display-lg": ["3.25rem", { lineHeight: "3.875rem", letterSpacing: "-0.02em", fontWeight: "400" }], "headline-sm": ["1.25rem", { lineHeight: "1.75rem", fontWeight: "700" }] } } } };</script><style>@layer base { html, body { min-height: 100%; margin: 0; padding: 0; background-color: #fff8f5; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col antialiased"><main class="flex-1 min-h-screen flex flex-col w-full bg-surface pt-safe pb-safe relative overflow-hidden">
  <!-- Subtle warm archival gradient backdrop & soft ambient glow -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden select-none">
    <div class="absolute -top-24 -right-20 w-80 h-80 rounded-full bg-primary-fixed opacity-30 blur-3xl"></div>
    <div class="absolute top-1/2 -left-28 w-72 h-72 rounded-full bg-secondary-fixed opacity-25 blur-3xl"></div>
    <div class="absolute -bottom-16 right-0 w-64 h-64 rounded-full bg-tertiary-fixed opacity-35 blur-2xl"></div>
  </div>

  <!-- Full-viewport vertically distributed content wrapper -->
  <div class="relative z-10 flex-1 flex flex-col justify-between w-full px-space-lg py-space-xl">
    <!-- Top Editorial Header & Monogram -->
    <div class="w-full flex flex-col items-center text-center pt-space-md">
      <div class="w-14 h-14 rounded-xl bg-surface-container-high border border-outline-variant/30 flex items-center justify-center shadow-sm mb-space-md">
        <span class="font-headline-sm text-headline-sm text-primary select-none font-bold">S</span>
      </div>
      <h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight mb-1">Sign In</h1>
      <p class="font-body-sm text-body-sm text-on-surface-variant">Welcome back to your workspace</p>
    </div>

    <!-- Central Form Section -->
    <div class="w-full my-auto py-space-md">
      <div class="w-full bg-surface-container-lowest/90 backdrop-blur-sm rounded-xl p-space-lg border border-outline-variant/20 shadow-sm">
        <form class="flex flex-col gap-space-lg" id="loginForm" onsubmit="event.preventDefault();">
          <!-- Username Field -->
          <div class="flex flex-col gap-1.5 text-left">
            <label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="username">
              <span class="">Username</span>
            </label>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-outline material-symbols-outlined text-[18px]">alternate_email</span>
              <input autocomplete="username" class="w-full pl-10 pr-3 py-3 rounded-xl bg-surface-container-low text-on-surface font-body-sm text-body-sm placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors duration-200" id="username" name="username" placeholder="e.g. alex_dev" required="" type="text">
            </div>
          </div>
          <!-- Password Field -->
          <div class="flex flex-col gap-1.5 text-left">
            <div class="flex items-center justify-between">
              <label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
              <a class="font-label-sm text-label-sm text-primary hover:underline focus:outline-none" href="#">Forgot password?</a>
            </div>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-outline material-symbols-outlined text-[18px]">lock</span>
              <input autocomplete="current-password" class="w-full pl-10 pr-11 py-3 rounded-xl bg-surface-container-low text-on-surface font-body-sm text-body-sm placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors duration-200" id="password" name="password" placeholder="••••••••••••" required="" type="password">
              <button aria-label="Toggle password visibility" class="absolute right-3 p-1 rounded-lg text-outline hover:text-on-surface focus:outline-none flex items-center justify-center" id="togglePassword" type="button">
                <span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
              </button>
            </div>
          </div>
          <!-- Primary Action CTA -->
          <div class="pt-space-xs flex flex-col gap-space-sm">
            <button class="w-full h-12 rounded-xl bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm transition-all duration-150" id="submitBtn" type="submit">
              <span class="">Sign In</span>
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Bottom Anchored Link -->
    <div class="pb-space-sm flex flex-col items-center text-center">
      <a class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">
        Don't have an account? <span class="font-semibold text-primary underline underline-offset-2">Sign up</span>
      </a>
    </div>
  </div>
</main>

</body></html>
