<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "secondary-fixed-dim": "#ffb59e", "tertiary-fixed": "#ffdbca", "background": "#fff8f5", "on-tertiary-fixed-variant": "#5d4030", "inverse-on-surface": "#f8efea", "on-secondary": "#ffffff", "outline-variant": "#dcc1b8", "surface-tint": "#9c4323", "surface-container": "#f5ece7", "on-error-container": "#93000a", "on-surface-variant": "#56423c", "secondary-container": "#fe9572", "tertiary": "#755544", "primary": "#994121", "secondary-fixed": "#ffdbd0", "tertiary-container": "#8f6d5b", "surface": "#fff8f5", "secondary": "#99462a", "on-background": "#1e1b18", "on-tertiary": "#ffffff", "on-error": "#ffffff", "on-surface": "#1e1b18", "inverse-surface": "#34302c", "on-secondary-fixed": "#390b00", "surface-container-high": "#efe6e2", "surface-container-low": "#fbf2ed", "surface-container-highest": "#e9e1dc", "surface-container-lowest": "#ffffff", "surface-variant": "#e9e1dc", "on-primary-container": "#fffbff", "outline": "#89726b", "surface-bright": "#fff8f5", "primary-fixed": "#ffdbcf", "primary-container": "#b95936", "on-primary-fixed": "#390c00", "on-primary": "#ffffff", "primary-fixed-dim": "#ffb59c", "on-secondary-container": "#762c12", "on-primary-fixed-variant": "#7d2d0d", "on-tertiary-container": "#fffbff", "surface-dim": "#e1d8d4", "error-container": "#ffdad6", "error": "#ba1a1a", "on-secondary-fixed-variant": "#7a2f15", "on-tertiary-fixed": "#2c1609", "tertiary-fixed-dim": "#e7bea9", "inverse-primary": "#ffb59c" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "2rem", "space-sm": "0.5rem", "space-md": "1rem", "margin-mobile": "1rem", "space-lg": "1.5rem", "gutter": "1.5rem", "space-xs": "0.25rem", "space-xl": "2.5rem", "g y-md text-body-md min-h-screen flex flex-col antialiased"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(44,40,37,0.03)]"><div class="h-14 px-margin-mobile flex items-center justify-between"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] -ml-2 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight select-none">Sign Up</h1></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-surface min-h-screen" style="background: radial-gradient(120% 60% at 50% 0%, #fff1ea 0%, #fff8f5 60%, #fbf2ed 100%);"><div class="flex flex-col w-full px-margin-mobile pb-space-xl flex-1 justify-between">
<!-- Warm Editorial Brand Emblem & Introduction -->
<div class="flex flex-col items-start pt-space-md pb-space-lg"><h2 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Create Account</h2></div>
<!-- Sign Up Form Stack -->
<form class="flex flex-col gap-space-md w-full flex-1 justify-between" id="signup-form" onsubmit="event.preventDefault();"><!-- Fields Group -->
<div class="flex flex-col gap-space-md w-full pt-space-xs">
  <!-- First Name -->
  <div class="flex flex-col gap-space-xs">
    <label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="first-name">
      First Name <span class="text-primary">*</span>
    </label>
    <div class="relative flex items-center">
      <span class="material-symbols-outlined absolute left-3.5 text-[20px] text-outline pointer-events-none">badge</span>
      <input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl shadow-sm focus:outline-none focus:bg-surface-container-low transition-all" id="first-name" name="firstName" placeholder="e.g. Alex" required="" type="text">
    </div>
  </div>
  <!-- Last Name -->
  <div class="flex flex-col gap-space-xs">
    <label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="last-name">
      Last Name <span class="text-primary">*</span>
    </label>
    <div class="relative flex items-center">
      <span class="material-symbols-outlined absolute left-3.5 text-[20px] text-outline pointer-events-none">signature</span>
      <input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl shadow-sm focus:outline-none focus:bg-surface-container-low transition-all" id="last-name" name="lastName" placeholder="e.g. Rivera" required="" type="text">
    </div>
  </div>
  <!-- Username -->
  <div class="flex flex-col gap-space-xs">
    <label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="username">
      Username <span class="text-primary">*</span>
    </label>
    <div class="relative flex items-center">
      <span class="material-symbols-outlined absolute left-3.5 text-[20px] text-outline pointer-events-none">alternate_email</span>
      <input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl shadow-sm focus:outline-none focus:bg-surface-container-low transition-all" id="username" name="username" placeholder="e.g. alex_dev" required="" type="text">
    </div>
  </div>
  <!-- Email -->
  <div class="flex flex-col gap-space-xs">
    <label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="email">
      Email <span class="text-primary">*</span>
    </label>
    <div class="relative flex items-center">
      <span class="material-symbols-outlined absolute left-3.5 text-[20px] text-outline pointer-events-none">mail</span>
      <input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl shadow-sm focus:outline-none focus:bg-surface-container-low transition-all" id="email" name="email" placeholder="alex.rivera@example.com" required="" type="email">
    </div>
  </div>
  <!-- Password -->
  <div class="flex flex-col gap-space-xs">
    <label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="password">
      Password <span class="text-primary">*</span>
    </label>
    <div class="relative flex items-center">
      <span class="material-symbols-outlined absolute left-3.5 text-[20px] text-outline pointer-events-none">lock</span>
      <input class="w-full h-12 pl-11 pr-12 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl shadow-sm focus:outline-none focus:bg-surface-container-low transition-all" id="password" minlength="8" name="password" placeholder="At least 8 characters" required="" type="password">
      <button aria-label="Toggle password visibility" class="absolute right-1 w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" id="toggle-password" type="button">
        <span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
      </button>
    </div>
  </div>
</div>

<!-- Bottom Actions Stack anchored to bottom -->
<div class="pt-space-lg pb-space-sm flex flex-col gap-space-md">
  <button class="w-full h-12 rounded-xl bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition-all select-none cursor-pointer" id="submit-btn" type="submit">
    <span class="">Create Account</span>
    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
  </button>
  <div class="text-center">
    <p class="font-body-sm text-body-sm text-on-surface-variant">
      Already have an account? 
      <a class="font-label-lg text-label-lg text-primary hover:text-primary-container underline underline-offset-4 ml-1" href="#">Sign in</a>
    </p>
  </div>
</div></form>
<!-- Editorial Note / Workspace Guidelines -->

</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const form = document.getElementById('signup-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        if (submitBtn) {
          const originalContent = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML = `
            <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
            <span>Initializing Workspace...</span>
          `;
          setTimeout(function() {
            submitBtn.innerHTML = `
              <span class="material-symbols-outlined text-[20px]">check</span>
              <span>Workspace Ready</span>
            `;
            setTimeout(function() {
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalContent;
            }, 1800);
          }, 1200);
        }
      });
    }
  })();
</script></main></body></html>
