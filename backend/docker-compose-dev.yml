name: ai-assistant-dev

services:
  postgres:
    image: postgres:16
    container_name: rag-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-mlflow-db.sql:/docker-entrypoint-initdb.d/init-mlflow-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: rag-qdrant-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:6335:6333"
      - "127.0.0.1:6336:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: rag-redis-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: rag-mlflow-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
      - MLFLOW_SERVER_ALLOWED_HOSTS="*"
    volumes:
      - ./mlartifacts:/mlartifacts
    entrypoint: >
      /bin/sh -c "pip install --no-cache-dir 'psycopg[binary]' psycopg2-binary &&
      mlflow db upgrade postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/mlflow_db &&
      export MLFLOW_SERVER_ALLOWED_HOSTS='*' &&
      mlflow server
      --backend-store-uri postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/mlflow_db
      --default-artifact-root /mlartifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend-dev
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      mlflow:
        condition: service_started
    ports:
      - "8080:8000"
    volumes:
      # Live bind mount: edits on host update inside container instantly!
      - .:/app
    environment:
      - DB_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/rag_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=02-localhost-app
      - PROMPT_ALIAS=production
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VLLM_API_KEY=${VLLM_API_KEY:-EMPTY}
      - EMBEDDING_BASE_URL=http://host.docker.internal:8001/v1
      - LLM_BASE_URL=http://host.docker.internal:8002/v1
    env_file:
      - .env
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn contextforge.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_dev_data:
  qdrant_dev_data:
  redis_dev_data:
